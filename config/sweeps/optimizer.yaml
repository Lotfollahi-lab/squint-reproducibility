name: optimizer
method: bayes
run_cap: 10
metric:
    goal: minimize
    name: val_loss
    
parameters:
    optimizer_params.optimizer_name:
        values: 'adam'
    optimizer_params.lr:
        distribution: 'log_uniform_values'
        min: 0.00001
        max: 0.1
    optimizer_params.weight_decay:
        distribution: 'log_uniform_values'
        min: 0.00001
        max: 0.1