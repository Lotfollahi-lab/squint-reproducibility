experiment:
  seed: 0
  mode: standalone

logging:
  root_log_dir: /lustre/scratch126/cellgen/team361/am84/VQNiche/reproducibility/logs
  log_model: false
  offline: true
  enabled: true

dataset:
  dataset_name: xhs1000-39b_1p
  adata_batch_idx:
    - 1
    - 2
  adata_fname:
    - adata_batch1.h5ad
    - adata_batch2.h5ad

  feature_name: cell_gene_counts

  graph_params:
    coord_type: generic
    spatial_key: spatial
    delaunay: false
    n_neighs: 8
    radius: null
    include_self_loop: true

  label_name: cell_types

  transform_names:
    - RandomNodeSplit
  transform_params:
    val_ratio: 0.1
    test_ratio: 0.1

  root_data_dir: /lustre/scratch126/cellgen/team361/DATASETS

datamodule:
  loader_name: NeighborLoader
  loader_params:
    batch_size: 128
  sampler_name: NeighborSampler
  sampler_params:
    num_neighbors: [25, 10]
  inference_params:
    sample_neighbors_for_inference: false

model:
  model_name: GraphSAGE
  encoder_name: SAGE_Encoder
  attribute_decoder_name: LinearSoftmax
  predictor_name: Linear
  log_similarity_stats: true
  log_pearson_correlation: true
  
  encoder_params:
    hidden_channels: 32
    num_layers: 2
    act_first: true
    activation: relu
    norm: BatchNorm
    dropout: 0.1
    init_method: kaiming_uniform

  optimizer_params:
    optimizer_name: adam
    lr: 0.01
    weight_decay: 0.0

  loss_params:
    loss_names:
      - cross_entropy
    loss_kwargs:
      wt_cross_entropy: 1.0

trainer:
  checkpoint_params:
    mode: max
    save_top_k: 1
    save_last: true
  max_epochs: 10
  enable_checkpointing: true
  ckpt_path: best