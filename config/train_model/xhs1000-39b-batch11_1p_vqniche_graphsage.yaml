experiment:
  seed: 0
  mode: standalone

logging:
  root_log_dir: /nfs/team361/am84/VQNiche/logs/
  log_model: false
  offline: true
  enabled: true

dataset:
  dataset_name: xhs1000-39b_1p
  adata_batch_idx:
    - 11
  adata_fname:
    - adata_batch11.h5ad

  root_data_dir: /lustre/scratch126/cellgen/lotfollahi/DATASETS

  gene_count_transform_names:
    - SubsetHVG
  gene_count_transform_params:
    n_genes: 1000

  graph_params:
    spatial_key: spatial
    delaunay: false
    n_neighs: 8
    radius: null

  feature_names:
      - X
      # - U_lm_eigvecs
      # - U_deepwalk
      # - U_gosh

  label_name: cell_types

  train_transform_names:
    - RandomNodeSplit
  train_transform_params:
    val_ratio: 0.1
    test_ratio: 0.1

datamodule:
  loader_name: NeighborLoader
  loader_params:
    batch_size: 512
  sampler_name: NeighborSampler
  sampler_params:
    num_neighbors: [5, 10]
  inference_params:
    sample_neighbors_for_inference: false

model:
  model_name: VQNiche
  encoder_name: VQNiche_Encoder
  attribute_decoder_name: MLPSoftmax
  adjacency_decoder_name: MLP_AdjacencyDecoder
  predictor_name: Linear

  train_metrics_list:
    - pearson_cell_wise
    - pearson_1hop_nbr
    - mmd_degree
    - mmd_eigenvalues
    - num_edges
    - max_degree

  encoder_params:
    gnn_name: SAGEConv
    mlp_params:
      hidden_channels: [200, 100]
      dropout: 0.1
      act: relu
      norm: null
    gnn_params:
      hidden_channels: 50
      num_layers: 1
      act_first: true
      activation: relu
      norm: null
      dropout: 0.1
      init_method: kaiming_uniform

    vq_params:
      vq_name: VectorQuantize
      # VQ related params
      freeze_codebook: false # should always be false

      # EMA update related params
      use_cosine_sim: true
      # use_cosine_sim: false
      ema_update: true # if true, learnable related stuff is ignored
      manual_ema_update: false
      threshold_ema_dead_code: 20
      manual_in_place_optimizer_update: false # must be false if ema_update is true
      learnable_codebook: false # must be false if ema_update is true

      # Learnable update related params
      # use_cosine_sim: false
      # learnable_codebook: true
      # straight_through: false
      # rotation_trick: true
      # in_place_codebook_optimizer: null
      # manual_in_place_optimizer_update: false
      # ema_update: false

      # codebook related params
      codebook_size: 4096
      heads: 1
      separate_codebook_per_head: false
      decay: 0.8
      eps: 0.00001
      kmeans_init: false
      kmeans_iters: 10
      sync_kmeans: true
      sample_codebook_temp: 0.0

      # commitment loss related params
      commitment_weight: 0.0
      commitment_use_cross_entropy_loss: false

      # codebook diversity loss related params
      codebook_diversity_loss_weight: 0.0
      codebook_diversity_temperature: 100.0

      # orthogonal loss related params
      orthogonal_reg_weight: 0.0
      orthogonal_reg_max_codes: null
      orthogonal_reg_active_codes_only: false

  attribute_decoder_params:
    use_xy_coordinates: false
    mlp_params:
      hidden_channels: [50, 100]
      dropout: 0.1
      act: relu
      norm: batch_norm

  adjacency_decoder_params:
    mlp_params:
      hidden_channels: []
      dropout: 0.1
      act: relu
      norm: null

  optimizer_params:
    optimizer_name: adam
    lr: 0.0005
    weight_decay: 0.001

  loss_params:
    loss_names:
      # - cross_entropy_loss
      # - mse_attribute_reconstruction_loss
      - nb_attribute_reconstruction_loss
      - mse_adjacency_reconstruction_loss
      # - mse_joint_code_commit_loss
      - mse_commit_loss
      - mse_code_loss
    loss_kwargs:
      estimate_adj_kwargs:
        nonlinearity: relu-clamp
        k: 8
      wt_cross_entropy: 1.0
      wt_attr_reconstr: 1.0
      wt_adj_reconstr: 1.0
      wt_joint_code_commit: 1.0
      wt_commit: 1.0
      wt_code: 1.0

trainer:
  checkpoint_params:
    mode: max
    save_top_k: 1
    save_last: true
  max_epochs: 10
  enable_checkpointing: true
  ckpt_path: best